<svg width="900" height="420" viewBox="0 0 900 380"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8"
            refX="7" refY="4" orient="auto"
            markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2f3b44"/>
    </marker>
  </defs>

  <!-- ===== Top level ===== -->

  <!-- current_user -->
  <rect x="500" y="20" width="200" height="44" rx="22" ry="22"
        fill="#fff7e6" stroke="#f5a623" stroke-width="2"/>
  <text x="600" y="48"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18"
        fill="#2f3b44">
    current_user
  </text>

  <!-- ===== Second level ===== -->

  <!-- active_user -->
  <rect x="420" y="110" width="200" height="44" rx="22" ry="22"
        fill="#fff7e6" stroke="#f5a623" stroke-width="2"/>
  <text x="520" y="138"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18"
        fill="#2f3b44">
    active_user
  </text>

  <!-- /items/public/ -->
  <rect x="670" y="110" width="210" height="52"
        fill="#fff7e6" stroke="#f5a623" stroke-width="2"/>
  <text x="775" y="143"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        fill="#2f3b44">
    /items/public/
  </text>

  <!-- ===== Third level ===== -->

  <!-- admin_user -->
  <rect x="150" y="210" width="180" height="44" rx="22" ry="22"
        fill="#fff7e6" stroke="#f5a623" stroke-width="2"/>
  <text x="240" y="238"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18"
        fill="#2f3b44">
    admin_user
  </text>

  <!-- paying_user -->
  <rect x="430" y="210" width="180" height="44" rx="22" ry="22"
        fill="#fff7e6" stroke="#f5a623" stroke-width="2"/>
  <text x="520" y="238"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18"
        fill="#2f3b44">
    paying_user
  </text>

  <!-- /items/private/ -->
  <rect x="670" y="210" width="210" height="52"
        fill="#fff7e6" stroke="#f5a623" stroke-width="2"/>
  <text x="775" y="243"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        fill="#2f3b44">
    /items/private/
  </text>

  <!-- ===== Bottom level ===== -->

  <!-- /users/{user_id}/activate -->
  <rect x="60" y="310" width="360" height="52"
        fill="#fff7e6" stroke="#f5a623" stroke-width="2"/>
  <text x="240" y="343"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        fill="#2f3b44">
    /users/{user_id}/activate
  </text>

  <!-- /items/pro/ -->
  <rect x="430" y="310" width="210" height="52"
        fill="#fff7e6" stroke="#f5a623" stroke-width="2"/>
  <text x="535" y="343"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        fill="#2f3b44">
    /items/pro/
  </text>

  <!-- ===== Arrows ===== -->

  <!-- current_user -> active_user -->
  <path d="M560 64 C540 85, 520 85, 520 110"
        fill="none" stroke="#2f3b44" stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- current_user -> items/public -->
  <path d="M640 64 C700 85, 740 95, 775 110"
        fill="none" stroke="#2f3b44" stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- active_user -> admin_user -->
  <path d="M420 140 C300 165, 260 185, 240 210"
        fill="none" stroke="#2f3b44" stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- active_user -> paying_user -->
  <path d="M520 154 C520 175, 520 190, 520 210"
        fill="none" stroke="#2f3b44" stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- active_user -> items/private -->
  <path d="M620 140 C650 165, 730 185, 775 210"
        fill="none" stroke="#2f3b44" stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- admin_user -> activate -->
  <path d="M240 254 C240 275, 240 290, 240 310"
        fill="none" stroke="#2f3b44" stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- paying_user -> items/pro -->
  <path d="M520 254 C520 275, 520 290, 520 310"
        fill="none" stroke="#2f3b44" stroke-width="2"
        marker-end="url(#arrow)"/>

</svg>
