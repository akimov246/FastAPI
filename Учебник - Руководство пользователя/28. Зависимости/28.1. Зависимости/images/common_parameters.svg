<svg width="430" height="230" viewBox="0 0 430 230"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8"
            refX="7" refY="4" orient="auto"
            markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2f3b44"/>
    </marker>
  </defs>

  <!-- Top rounded block -->
  <rect x="95" y="18" width="240" height="44" rx="22" ry="22"
        fill="#fff7e6" stroke="#f5a623" stroke-width="2"/>
  <text x="215" y="46"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18"
        fill="#2f3b44">
    common_parameters
  </text>

  <!-- Left bottom block -->
  <rect x="30" y="145" width="160" height="52"
        fill="#fff7e6" stroke="#f5a623" stroke-width="2"/>
  <text x="110" y="178"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        fill="#2f3b44">
    /items/
  </text>

  <!-- Right bottom block -->
  <rect x="240" y="145" width="160" height="52"
        fill="#fff7e6" stroke="#f5a623" stroke-width="2"/>
  <text x="320" y="178"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        fill="#2f3b44">
    /users/
  </text>

  <!-- Curved arrows -->
  <path d="M155 62
           C135 85, 115 105, 110 145"
        fill="none"
        stroke="#2f3b44"
        stroke-width="2"
        marker-end="url(#arrow)"/>

  <path d="M275 62
           C295 85, 315 105, 320 145"
        fill="none"
        stroke="#2f3b44"
        stroke-width="2"
        marker-end="url(#arrow)"/>

</svg>
