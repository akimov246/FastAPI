<svg width="300" height="260" viewBox="0 0 300 230"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <style>
      .box {
        fill: #FFF3E0;
        stroke: #F5A623;
        stroke-width: 2;
        rx: 25;
        ry: 25;
      }
      .endpoint {
        fill: #FFF3E0;
        stroke: #F5A623;
        stroke-width: 2;
      }
      .text {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        fill: #000000;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .arrow {
        stroke: #000000;
        stroke-width: 2;
        fill: none;
        marker-end: url(#arrowhead);
      }
    </style>

    <marker id="arrowhead" markerWidth="10" markerHeight="7"
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>

  <!-- Top box -->
  <rect x="60" y="20" width="180" height="50" class="box"/>
  <text x="150" y="45" class="text">query_extractor</text>

  <!-- Arrow -->
  <line x1="150" y1="70" x2="150" y2="105" class="arrow"/>

  <!-- Middle box -->
  <rect x="30" y="105" width="240" height="50" class="box"/>
  <text x="150" y="130" class="text">query_or_cookie_extractor</text>

  <!-- Arrow -->
  <line x1="150" y1="155" x2="150" y2="190" class="arrow"/>

  <!-- Bottom endpoint -->
  <rect x="90" y="190" width="120" height="40" class="endpoint"/>
  <text x="150" y="210" class="text">/items/</text>

</svg>
